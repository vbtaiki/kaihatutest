<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Fingerprint - 画像検索システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            background: #eef1ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e0e7ff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        #fileInput {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .preview-container {
            margin: 20px 0;
            text-align: center;
        }

        .preview-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .results {
            margin-top: 30px;
        }

        .result-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .result-item {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .result-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }

        .result-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .result-filename {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .result-similarity {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .result-distance {
            font-size: 0.8em;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            display: none;
        }

        .success-message {
            color: #4a9;
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Book Fingerprint</h1>
        <p class="subtitle">画像をアップロードして類似の本を検索</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <p>クリックまたはドラッグ&ドロップで画像をアップロード</p>
            <p style="font-size: 0.8em; color: #999; margin-top: 10px;">PNG, JPG, JPEG (最大16MB)</p>
            <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg">
        </div>

        <div class="preview-container" id="previewContainer" style="display: none;">
            <p style="color: #666; margin-bottom: 10px;">アップロード画像:</p>
            <img id="previewImage" class="preview-image" alt="Preview">
        </div>

        <div class="preview-container" id="processedPreviewContainer" style="display: none;">
            <p style="color: #667eea; margin-bottom: 10px; font-weight: bold;">前処理済み画像（検索に使用）:</p>
            <img id="processedPreviewImage" class="preview-image" alt="Processed Preview">
        </div>

        <div style="text-align: center;">
            <button class="btn" id="searchBtn" disabled>検索実行</button>
        </div>

        <div class="error" id="errorMsg"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">検索中...</p>
        </div>

        <div class="results" id="results" style="display: none;">
            <h2 class="result-title">検索結果</h2>
            <div class="result-grid" id="resultGrid"></div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const processedPreviewContainer = document.getElementById('processedPreviewContainer');
        const processedPreviewImage = document.getElementById('processedPreviewImage');
        const searchBtn = document.getElementById('searchBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const resultGrid = document.getElementById('resultGrid');
        const errorMsg = document.getElementById('errorMsg');

        let selectedFile = null;

        // クリックでファイル選択
        uploadArea.addEventListener('click', () => fileInput.click());

        // ファイル選択時
        fileInput.addEventListener('change', handleFileSelect);

        // ドラッグ&ドロップ
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }

        function handleFile(file) {
            if (!file.type.match('image/(png|jpeg|jpg)')) {
                showError('PNG, JPG, JPEG形式の画像のみアップロードできます');
                return;
            }

            selectedFile = file;

            // プレビュー表示
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.style.display = 'block';
                searchBtn.disabled = false;
                hideError();
            };
            reader.readAsDataURL(file);
        }

        // 検索実行
        searchBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('image', selectedFile);

            loading.style.display = 'block';
            results.style.display = 'none';
            hideError();
            searchBtn.disabled = true;

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '検索に失敗しました');
                }

                // 前処理済み画像を表示
                if (data.query_image_url) {
                    processedPreviewImage.src = data.query_image_url;
                    processedPreviewContainer.style.display = 'block';
                }

                displayResults(data.results);
            } catch (error) {
                showError(error.message);
            } finally {
                loading.style.display = 'none';
                searchBtn.disabled = false;
            }
        });

        function displayResults(resultsData) {
            resultGrid.innerHTML = '';

            if (resultsData.length === 0) {
                resultGrid.innerHTML = '<p style="text-align: center; color: #666;">一致する画像が見つかりませんでした</p>';
            } else {
                resultsData.forEach(result => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item';

                    resultItem.innerHTML = `
                        <img src="${result.image_url}" alt="${result.filename}" class="result-image">
                        <div class="result-similarity">${result.similarity}%</div>
                        <div class="result-filename">${result.filename}</div>
                        <div class="result-distance">距離: ${result.distance}</div>
                    `;

                    resultGrid.appendChild(resultItem);
                });
            }

            results.style.display = 'block';
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }

        function hideError() {
            errorMsg.style.display = 'none';
        }
    </script>
</body>
</html>
