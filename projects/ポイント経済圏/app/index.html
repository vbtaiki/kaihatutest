<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バリューブックス ポイント経済圏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <header class="header">
      <div class="header-inner">
        <h1 class="logo">📚 VALUE BOOKS</h1>
        <div class="user-info">
          <span class="point-badge">🪙 <span id="point-display">2,450</span> pt</span>
          <span class="user-name">中村さん</span>
        </div>
      </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="main">
      <!-- ポイント残高カード -->
      <section class="balance-card">
        <div class="balance-label">ポイント残高</div>
        <div class="balance-amount"><span id="balance">2,450</span> <span class="unit">pt</span></div>
        <div class="balance-yen">（¥2,450相当）</div>
        <div class="balance-expire">有効期限: 2027年2月9日</div>
      </section>

      <!-- アクションボタン -->
      <section class="actions">
        <button class="action-btn primary" onclick="openBuyback()">
          <span class="action-icon">📦</span>
          <span class="action-label">本を売って<br>ポイント獲得</span>
        </button>
        <button class="action-btn secondary" onclick="openShop()">
          <span class="action-icon">🛒</span>
          <span class="action-label">ポイントで<br>本を買う</span>
        </button>
      </section>

      <!-- ポイント獲得のお知らせ -->
      <section class="info-banner">
        <div class="info-icon">💡</div>
        <div class="info-text">
          <strong>ポイントで受け取ると10%おトク！</strong><br>
          買取金額2,000円 → 現金なら2,000円、ポイントなら<strong>2,200pt</strong>
        </div>
      </section>

      <!-- 取引履歴 -->
      <section class="history">
        <h2 class="section-title">取引履歴</h2>
        <div class="history-list" id="history-list">
          <!-- JavaScriptで動的に生成 -->
        </div>
      </section>
    </main>

    <!-- 買取モーダル -->
    <div class="modal" id="buyback-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>本を売ってポイントを獲得</h2>
          <button class="modal-close" onclick="closeModal('buyback-modal')">&times;</button>
        </div>
        <div class="modal-body">
          <div class="buyback-estimate">
            <label>買取見積もり金額</label>
            <input type="number" id="buyback-amount" value="2000" class="input-amount">
          </div>
          <div class="receive-options">
            <label>受け取り方法</label>
            <div class="option-cards">
              <div class="option-card" id="opt-cash" onclick="selectOption('cash')">
                <div class="option-title">💴 現金振込</div>
                <div class="option-amount" id="cash-amount">¥2,000</div>
              </div>
              <div class="option-card selected" id="opt-point" onclick="selectOption('point')">
                <div class="option-title">🪙 ポイント <span class="bonus-tag">+10%</span></div>
                <div class="option-amount" id="point-amount">2,200 pt</div>
              </div>
            </div>
          </div>
          <button class="submit-btn" onclick="submitBuyback()">この内容で申し込む</button>
        </div>
      </div>
    </div>

    <!-- 購入モーダル -->
    <div class="modal" id="shop-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>ポイントで本を買う</h2>
          <button class="modal-close" onclick="closeModal('shop-modal')">&times;</button>
        </div>
        <div class="modal-body">
          <div class="book-list">
            <div class="book-item" onclick="buyBook(800, 'ソクラテスの弁明')">
              <div class="book-cover">📕</div>
              <div class="book-info">
                <div class="book-title">ソクラテスの弁明</div>
                <div class="book-author">プラトン</div>
                <div class="book-price">800 pt</div>
              </div>
            </div>
            <div class="book-item" onclick="buyBook(650, 'ウォールデン 森の生活')">
              <div class="book-cover">📗</div>
              <div class="book-info">
                <div class="book-title">ウォールデン 森の生活</div>
                <div class="book-author">H.D.ソロー</div>
                <div class="book-price">650 pt</div>
              </div>
            </div>
            <div class="book-item" onclick="buyBook(1200, 'サピエンス全史')">
              <div class="book-cover">📘</div>
              <div class="book-info">
                <div class="book-title">サピエンス全史</div>
                <div class="book-author">ユヴァル・ノア・ハラリ</div>
                <div class="book-price">1,200 pt</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
