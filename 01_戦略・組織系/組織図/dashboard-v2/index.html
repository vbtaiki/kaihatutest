<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Value Books OS Dashboard v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00BFA5;
            --primary-light: #E0F7F4;
            --primary-dark: #00A896;
            --bg: #FAFBFC;
            --white: #FFFFFF;
            --text: #1A1A1A;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #E8E8E8;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.1);
            --accent-orange: #FF9800;
            --accent-blue: #2196F3;
            --accent-purple: #9C27B0;
            --accent-red: #F44336;
            --success: #4CAF50;
            --warning: #FFC107;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans JP', sans-serif;
            min-height: 100vh;
            line-height: 1.7;
        }

        /* Header */
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .logo-text span {
            color: var(--primary);
        }

        .logo-badge {
            background: var(--primary);
            color: white;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .sync-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--primary-light);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--primary-dark);
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 88px 2rem 2rem;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, #26D0B8 100%);
            border-radius: 16px;
            padding: 3rem;
            margin-bottom: 2rem;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero-eyebrow {
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .hero-title {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 0.75rem;
        }

        .hero-subtitle {
            font-size: 1rem;
            opacity: 0.9;
            max-width: 600px;
        }

        .hero-stats {
            display: flex;
            gap: 3rem;
            margin-top: 2rem;
        }

        .hero-stat {
            text-align: left;
        }

        .hero-stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .hero-stat-label {
            font-size: 0.85rem;
            opacity: 0.85;
        }

        .view-selector-container {
            position: absolute;
            top: 2.5rem;
            right: 3rem;
            z-index: 2;
        }

        .view-selector {
            padding: 0.65rem 1.25rem;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }

        .view-selector:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .view-selector:focus {
            outline: none;
            border-color: white;
        }

        .view-selector option {
            color: var(--text);
            background: white;
        }

        /* Teams Grid */
        .section {
            margin-bottom: 2.5rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.25rem;
        }

        /* Team Card */
        .team-card {
            background: var(--white);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 1.75rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .team-card:hover {
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .team-card-header {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .team-icon {
            width: 52px;
            height: 52px;
            background: var(--primary-light);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .team-info {
            flex: 1;
            min-width: 0;
        }

        .team-id {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }

        .team-name {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .team-mission {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Expectation Block */
        .team-expectation {
            background: linear-gradient(to right, var(--primary-light), transparent);
            border-left: 4px solid var(--primary);
            padding: 1rem 1.25rem;
            border-radius: 0 12px 12px 0;
            margin: 1rem 0;
            display: none;
        }

        .team-expectation-label {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .team-expectation-text {
            font-size: 0.9rem;
            color: var(--text);
            line-height: 1.7;
        }

        /* KPI Section */
        .team-kpis {
            margin-top: 1rem;
            display: none;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .kpi-item {
            background: #F8F9FA;
            padding: 0.75rem;
            border-radius: 8px;
        }

        .kpi-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .kpi-value {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
        }

        /* Projects */
        .team-projects {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .project-badge {
            padding: 0.35rem 0.75rem;
            background: #F5F5F5;
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.2s ease;
        }

        .project-badge:hover {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-planning { background: var(--warning); }
        .status-progress { background: var(--accent-blue); }
        .status-completed { background: var(--success); }

        /* Members */
        .team-members {
            margin-top: 1rem;
            display: none;
        }

        .member-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .member-chip {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.75rem;
            background: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .member-chip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .member-avatar {
            width: 24px;
            height: 24px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
        }

        /* Focused State */
        .team-card.focused {
            grid-column: span 2;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .team-card.focused .team-name {
            color: var(--primary);
            font-size: 1.35rem;
        }

        .team-card.focused .team-expectation,
        .team-card.focused .team-kpis,
        .team-card.focused .team-members {
            display: block;
        }

        .team-card.focused .project-badge {
            background: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 500;
        }

        /* Blurred State */
        .team-card.blurred {
            opacity: 0.45;
            transform: scale(0.98);
        }

        .team-card.blurred:hover {
            opacity: 0.7;
            transform: scale(1);
        }

        /* Stats Summary */
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            margin-top: 3rem;
            background: var(--white);
        }

        .footer-links {
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .teams-grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            }

            .team-card.focused {
                grid-column: span 1;
            }

            .stats-summary {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .header-content {
                flex-direction: column;
                gap: 0.75rem;
                height: auto;
                padding: 0.75rem 0;
            }

            .main {
                padding-top: 140px;
            }

            .hero {
                padding: 2rem;
            }

            .hero-title {
                font-size: 1.5rem;
            }

            .hero-stats {
                flex-direction: column;
                gap: 1.5rem;
            }

            .view-selector-container {
                position: static;
                margin-top: 1.5rem;
            }

            .stats-summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <div class="logo-icon">📖</div>
                <div>
                    <span class="logo-text">VALUE <span>BOOKS</span> OS</span>
                    <span class="logo-badge">V2</span>
                </div>
            </a>
            <div class="header-status">
                <div class="sync-indicator">
                    <span class="sync-dot"></span>
                    <span id="syncStatus">リアルタイム同期</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <div class="hero-eyebrow">📖 2026-2028 全社ビジョン</div>
                <h1 class="hero-title">100億・100億・100億。<br>人間的幸福のリーダーへ</h1>
                <p class="hero-subtitle">古本・新刊・MD。3つの柱で300億を達成し、本を通じて人間をアナログな幸せに引き戻す</p>

                <div class="hero-stats">
                    <div class="hero-stat">
                        <div class="hero-stat-value">300億</div>
                        <div class="hero-stat-label">売上目標</div>
                    </div>
                    <div class="hero-stat">
                        <div class="hero-stat-value" id="teamCount">-</div>
                        <div class="hero-stat-label">チーム</div>
                    </div>
                    <div class="hero-stat">
                        <div class="hero-stat-value" id="memberCount">-</div>
                        <div class="hero-stat-label">メンバー</div>
                    </div>
                </div>
            </div>

            <div class="view-selector-container">
                <select class="view-selector" id="viewSelect">
                    <option value="all">全チーム概要</option>
                </select>
            </div>
        </section>

        <!-- Stats Summary -->
        <div class="stats-summary" id="statsSummary"></div>

        <!-- Teams Section -->
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">
                    🏢 チーム一覧
                    <span style="font-size: 0.75rem; font-weight: 400; color: var(--text-muted); margin-left: 0.5rem;">
                        自チームを選択で詳細表示
                    </span>
                </h2>
            </div>
            <div class="teams-grid" id="teamGrid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>データを読み込んでいます...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p><strong>VALUE BOOKS OS v2</strong> | Organization as Code</p>
        <p style="margin-top: 0.5rem; font-size: 0.8rem;">
            最終更新: <span id="lastUpdated">-</span>
        </p>
        <div class="footer-links">
            <a href="../README.md">ドキュメント</a>
            <a href="https://github.com/valuebooks/vb-os">GitHub</a>
        </div>
    </footer>

    <script>
        // グローバル変数
        let dashboardData = null;

        // データ読み込み
        async function loadData() {
            try {
                const response = await fetch('data.json');
                dashboardData = await response.json();

                // メタ情報を更新
                updateMetaInfo();

                // ビューセレクターを構築
                buildViewSelector();

                // 統計サマリーを表示
                renderStatsSummary();

                // チームグリッドをレンダリング
                renderTeams();

            } catch (error) {
                console.error('データの読み込みに失敗しました:', error);
                document.getElementById('teamGrid').innerHTML = `
                    <div style="text-align: center; padding: 3rem; color: var(--accent-red);">
                        <p>❌ データの読み込みに失敗しました</p>
                        <p style="font-size: 0.85rem; margin-top: 0.5rem;">data.jsonが存在するか確認してください</p>
                    </div>
                `;
            }
        }

        // メタ情報を更新
        function updateMetaInfo() {
            const { meta, teams, members } = dashboardData;

            // 更新日時を表示
            const updatedDate = new Date(meta.updated_at);
            document.getElementById('lastUpdated').textContent = updatedDate.toLocaleString('ja-JP');

            // チーム数・メンバー数を表示
            document.getElementById('teamCount').textContent = teams.length;
            document.getElementById('memberCount').textContent = members.length;
        }

        // ビューセレクターを構築
        function buildViewSelector() {
            const select = document.getElementById('viewSelect');

            dashboardData.teams.forEach(team => {
                const option = document.createElement('option');
                option.value = team.id;
                option.textContent = `${team.icon} ${team.name}`;
                select.appendChild(option);
            });
        }

        // 統計サマリーを表示
        function renderStatsSummary() {
            const { teams, members } = dashboardData;

            const totalProjects = teams.reduce((sum, team) => sum + team.projects.length, 0);
            const totalKPIs = teams.reduce((sum, team) => sum + team.kpis.length, 0);

            const summaryHTML = `
                <div class="stat-card">
                    <div class="stat-value">${teams.length}</div>
                    <div class="stat-label">機能チーム</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${members.length}</div>
                    <div class="stat-label">メンバー</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${totalProjects}</div>
                    <div class="stat-label">プロジェクト</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${totalKPIs}</div>
                    <div class="stat-label">KPI指標</div>
                </div>
            `;

            document.getElementById('statsSummary').innerHTML = summaryHTML;
        }

        // チームグリッドをレンダリング
        function renderTeams() {
            const grid = document.getElementById('teamGrid');
            const selectedView = document.getElementById('viewSelect').value;

            grid.innerHTML = '';

            dashboardData.teams.forEach(team => {
                const card = createTeamCard(team, selectedView);
                grid.appendChild(card);
            });
        }

        // チームカードを作成
        function createTeamCard(team, selectedView) {
            const card = document.createElement('div');
            card.className = 'team-card';

            // Variable Resolution適用
            if (selectedView !== 'all') {
                if (team.id === selectedView) {
                    card.classList.add('focused');
                } else {
                    card.classList.add('blurred');
                }
            }

            // カード内容を構築
            card.innerHTML = `
                <div class="team-card-header">
                    <div class="team-icon">${team.icon}</div>
                    <div class="team-info">
                        <div class="team-id">${team.id}</div>
                        <h3 class="team-name">${team.name}</h3>
                        <p class="team-mission">${team.mission}</p>
                    </div>
                </div>

                ${team.expectation ? `
                    <div class="team-expectation">
                        <div class="team-expectation-label">💭 Founder's Expectation</div>
                        <div class="team-expectation-text">${team.expectation}</div>
                    </div>
                ` : ''}

                ${team.kpis.length > 0 ? `
                    <div class="team-kpis">
                        <div class="kpi-grid">
                            ${team.kpis.slice(0, 4).map(kpi => `
                                <div class="kpi-item">
                                    <div class="kpi-label">${kpi.指標}</div>
                                    <div class="kpi-value">${kpi.現状} → ${kpi.目標}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}

                ${team.members.length > 0 ? `
                    <div class="team-members">
                        <div class="member-chips">
                            ${team.members.map(member => `
                                <div class="member-chip">
                                    <div class="member-avatar">${member.名前.charAt(0)}</div>
                                    <span>${member.名前}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}

                ${team.projects.length > 0 ? `
                    <div class="team-projects">
                        ${team.projects.map(project => `
                            <div class="project-badge">
                                <span class="status-dot status-${project.status}"></span>
                                <span>${project.name}</span>
                            </div>
                        `).join('')}
                    </div>
                ` : ''}
            `;

            return card;
        }

        // ビュー切り替え
        document.getElementById('viewSelect').addEventListener('change', renderTeams);

        // 初期読み込み
        loadData();
    </script>
</body>
</html>
