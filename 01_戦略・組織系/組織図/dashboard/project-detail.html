<html lang="ja">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00BFA5;
            --primary-light: #E0F7F4;
            --primary-dark: #00A896;
            --bg: #FAFBFC;
            --white: #FFFFFF;
            --text: #1A1A1A;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #E8E8E8;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.1);
            --orange: #FF9800;
            --orange-light: #FFF3E0;
            --blue: #2196F3;
            --blue-light: #E3F2FD;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans JP', sans-serif;
            min-height: 100vh;
            line-height: 1.7;
        }

        a { color: inherit; text-decoration: none; }

        /* Header */
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }

        .logo { display: flex; align-items: center; gap: 0.5rem; }

        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .logo-text span { color: var(--primary); }

        .nav { display: flex; gap: 0.5rem; }

        .nav a {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .nav a:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav a.active {
            background: var(--primary);
            color: white;
        }

        /* Main */
        .main {
            max-width: 900px;
            margin: 0 auto;
            padding: 88px 2rem 2rem;
        }

        /* Back Link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: opacity 0.2s;
        }

        .back-link:hover { opacity: 0.7; }

        /* Doc Header (Strategy-like) */
        .doc-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 2.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
        }

        .doc-version {
            font-size: 0.75rem;
            background: rgba(255,255,255,0.2);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .doc-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .doc-subtitle {
            font-size: 1rem;
            opacity: 0.9;
        }

        .project-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            margin-bottom: 0.75rem;
        }

        .project-status-badge.planning {
            background: rgba(255, 152, 0, 0.18);
            color: #FFE0B2;
            border: 1px solid rgba(255, 224, 178, 0.5);
        }

        .project-status-badge.progress {
            background: rgba(33, 150, 243, 0.18);
            color: #BBDEFB;
            border: 1px solid rgba(187, 222, 251, 0.5);
        }

        /* Section */
        .section {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .section-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-number {
            width: 32px;
            height: 32px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .section-title { font-size: 1.1rem; font-weight: 600; }

        .section-body { padding: 1.5rem; }

        /* Goal List */
        .goal-list { list-style: none; }

        .goal-list li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
        }

        .goal-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
        }

        /* Success Criteria */
        .success-criteria {
            background: var(--primary-light);
            border-left: 4px solid var(--primary);
            padding: 1rem 1.25rem;
            border-radius: 0 8px 8px 0;
        }

        .success-criteria-label {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .success-criteria-content {
            font-size: 0.95rem;
            color: var(--text);
        }

        /* Text Blocks / Bullet Lists */
        .text-block {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .bullet-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .bullet-list li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
        }

        .bullet-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
        }

        /* Link List */
        .link-list { list-style: none; padding: 0; margin: 0; }

        .link-list li { margin-bottom: 0.5rem; }

        .link-list a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            font-size: 0.9rem;
        }

        .link-list a:hover { opacity: 0.75; }

        /* Milestone */
        .milestone-list { list-style: none; }

        .milestone-item {
            display: flex;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
        }

        .milestone-item:last-child { border-bottom: none; }

        .milestone-phase {
            width: 80px;
            flex-shrink: 0;
            text-align: center;
        }

        .milestone-phase-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .milestone-phase-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary);
        }

        .milestone-content { flex: 1; }

        .milestone-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .milestone-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Team Card */
        .team-card {
            display: flex;
            gap: 1rem;
            padding: 1.25rem;
            background: #F9F9F9;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            margin-bottom: 1rem;
        }

        .team-card:last-child { margin-bottom: 0; }

        .team-card:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .team-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: var(--primary-light);
            flex-shrink: 0;
        }

        .team-info { flex: 1; }

        .team-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .team-role {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .team-arrow {
            color: var(--primary);
            font-size: 1.25rem;
            align-self: center;
        }

        /* Member Grid */
        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem;
        }

        .member-chip {
            display: flex;
            gap: 0.75rem;
            padding: 0.75rem;
            background: #F9F9F9;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            align-items: center;
        }

        .member-chip:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .member-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            background: var(--primary-light);
            color: var(--primary);
            flex-shrink: 0;
        }

        .member-avatar.leader {
            background: var(--primary);
            color: white;
        }

        .member-info-mini { flex: 1; min-width: 0; }

        .member-name-mini {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .member-role-mini {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Expectation Box */
        .expectation-box {
            background: var(--primary-light);
            border-left: 4px solid var(--primary);
            padding: 1rem 1.25rem;
            border-radius: 0 8px 8px 0;
        }

        .expectation-label {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .expectation-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
            background: var(--white);
        }

        .footer a { color: var(--primary); }

        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .header-content { flex-direction: column; gap: 0.75rem; height: auto; padding: 0.75rem 0; }
            .main { padding-top: 120px; }
            .member-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

                body: `
                    <a href="team-detail.html?id=${project.team.id}" class="team-card">
                        <div class="team-icon">${project.team.icon}</div>
                        <div class="team-info">
                            <div class="team-name">${project.team.name}</div>
                            <div class="team-role">${project.team.role}</div>
                        </div>
                        <span class="team-arrow">→</span>
                    </a>
                    <div class="expectation-box" style="margin-top: 1rem;">
                        <div class="expectation-label">💭 Founder's Expectation</div>
                        <p class="expectation-text">${project.team.expectation}</p>
                    </div>
                    ${project.relatedTeams && project.relatedTeams.length > 0 ? `
                    <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
                        <div style="font-size: 0.85rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--text-secondary);">連携チーム</div>
                        ${project.relatedTeams.map(t => `
                            <a href="team-detail.html?id=${t.id}" class="team-card">
                                <div class="team-icon">${t.icon}</div>
                                <div class="team-info">
                                    <div class="team-name">${t.name}</div>
                                    <div class="team-role">${t.role}</div>
                                </div>
                                <span class="team-arrow">→</span>
                            </a>
                        `).join('')}
                    </div>
                    ` : ''}
                `
            });

            // 7) Members (always)
            sections.push({
                title: '担当メンバー',
                body: `
                    <div class="member-grid">
                        ${project.members.map(m => `
                            <a href="member-detail.html?id=${m.id}" class="member-chip">
                                <div class="member-avatar ${m.leader ? 'leader' : ''}">${m.avatar}</div>
                                <div class="member-info-mini">
                                    <div class="member-name-mini">${m.name}</div>
                                    <div class="member-role-mini">${m.role}</div>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                `
            });

            // 8) Links (optional)
            if (project.links && project.links.length > 0) {
                sections.push({
                    title: '関連リンク',
                    body: `
                        <ul class="link-list">
                            ${project.links.map(l => `<li><a href="${l.href}">↗ ${l.label}</a></li>`).join('')}
                        </ul>
                    `
                });
            }

            content.innerHTML = `
                <a href="projects.html" class="back-link">← プロジェクト一覧に戻る</a>
                
                <div class="doc-header">
                    <span class="doc-version">Project</span>
                    <div class="project-status-badge ${project.status}">${project.status === 'progress' ? '🔵 進行中' : '🟠 計画中'}</div>
                    <h1 class="doc-title">${project.name}</h1>
                    <p class="doc-subtitle">${project.desc}</p>
                </div>
                ${sections.map((s, i) => `
                    <div class="section">
                        <div class="section-header">
                            <div class="section-number">${i + 1}</div>
                            <h2 class="section-title">${s.title}</h2>
                        </div>
                        <div class="section-body">${s.body}</div>
                    </div>
                `).join('')}
            `;
        }

        render();
    </script>
</body>
</html>
