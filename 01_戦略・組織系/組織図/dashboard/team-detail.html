    <style>
        :root {
            --primary: #00BFA5;
            --primary-light: #E0F7F4;
            --primary-dark: #00A896;
            --bg: #FAFBFC;
            --white: #FFFFFF;
            --text: #1A1A1A;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #E8E8E8;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans JP', sans-serif;
            min-height: 100vh;
            line-height: 1.7;
        }

        a { color: inherit; text-decoration: none; }

        /* Header */
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }

        .logo { display: flex; align-items: center; gap: 0.5rem; }

        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .logo-text span { color: var(--primary); }

        .nav { display: flex; gap: 0.5rem; }

        .nav a {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .nav a:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav a.active {
            background: var(--primary);
            color: white;
        }

        /* Main */
        .main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 88px 2rem 2rem;
        }

        /* Back Link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: opacity 0.2s;
        }

        .back-link:hover { opacity: 0.7; }

        /* Team Header */
        .team-header {
            background: linear-gradient(135deg, var(--primary) 0%, #26D0B8 100%);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            color: white;
        }

        .team-header-top {
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .team-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background: rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .team-info { flex: 1; }

        .team-id {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-bottom: 0.25rem;
        }

        .team-name {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .team-mission {
            font-size: 1rem;
            opacity: 0.9;
        }

        /* Expectation Box */
        .expectation-box {
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 1.25rem;
        }

        .expectation-label {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            opacity: 0.9;
        }

        .expectation-text {
            font-size: 0.95rem;
            line-height: 1.8;
        }

        /* Section */
        .section {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .section-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-icon { font-size: 1.25rem; }

        .section-title { font-size: 1rem; font-weight: 600; }

        .section-count {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: #F5F5F5;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
        }

        .section-body { padding: 1.5rem; }

        /* Member Card */
        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .member-card {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: #F9F9F9;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .member-card:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .member-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 600;
            background: var(--primary-light);
            color: var(--primary);
            flex-shrink: 0;
        }

        .member-avatar.leader {
            background: var(--primary);
            color: white;
        }

        .member-info { flex: 1; min-width: 0; }

        .member-name {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.15rem;
        }

        .member-role {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }

        .member-focus {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Project Card */
        .project-list { display: flex; flex-direction: column; gap: 0.75rem; }

        .project-card {
            display: flex;
            gap: 1rem;
            padding: 1rem 1.25rem;
            background: #F9F9F9;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            align-items: center;
        }

        .project-card:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .project-status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .project-status.planning { background: #FF9800; }
        .project-status.progress { background: #2196F3; }

        .project-info { flex: 1; min-width: 0; }

        .project-name {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .project-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .project-badge {
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .project-badge.planning {
            background: #FFF3E0;
            color: #FF9800;
        }

        .project-badge.progress {
            background: #E3F2FD;
            color: #2196F3;
        }

        .project-arrow {
            color: var(--primary);
            font-size: 1.25rem;
        }

        /* Related Teams */
        .related-teams {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        /* Media Card */
        .media-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .media-card {
            padding: 1.25rem;
            background: linear-gradient(135deg, #f8fffe 0%, #f0faf8 100%);
            border-radius: 12px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
        }

        .media-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .media-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
        }

        .media-leader {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: white;
            padding: 0.2rem 0.75rem;
            border-radius: 20px;
        }

        .media-target {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .media-desc {
            font-size: 0.9rem;
            color: var(--text-primary);
            line-height: 1.6;
            margin-bottom: 0.75rem;
        }

        .media-strategy {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: white;
            padding: 0.75rem;
            border-radius: 8px;
        }

        .related-team-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 0.75rem;
            background: #F5F5F5;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .related-team-badge:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
            background: var(--white);
        }

        .footer a { color: var(--primary); }

        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .header-content { flex-direction: column; gap: 0.75rem; height: auto; padding: 0.75rem 0; }
            .main { padding-top: 120px; }
            .team-header-top { flex-direction: column; text-align: center; }
            .team-icon { margin: 0 auto; }
            .member-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

                    { name: '積読チャンネル', leader: '社内メンバー', target: '一般読者', desc: '本を楽しむ熱量を伝え、マスの購買行動を喚起する。登録者17万人の熱心な読書家コミュニティ。', strategy: 'グッズ紹介によるマネタイズ、ポイント経済圏との連携' }
                ],
                relatedTeams: [
                    { id: 'web-dev', name: 'Web開発', icon: '💻' }
                ]
            }
        };

        // URLパラメータからチームIDを取得
        const params = new URLSearchParams(window.location.search);
        const teamId = params.get('id');

        function render() {
            const content = document.getElementById('content');

            if (!teamId || !teams[teamId]) {
                content.innerHTML = `
                    <a href="teams.html" class="back-link">← チーム一覧に戻る</a>
                    <div class="section">
                        <div class="section-body">
                            <p style="text-align: center; color: var(--text-muted);">チームが見つかりません</p>
                        </div>
                    </div>
                `;
                return;
            }

            const team = teams[teamId];
            document.title = `${team.name} | Value Books OS`;

            content.innerHTML = `
                <a href="teams.html" class="back-link">← チーム一覧に戻る</a>

                <div class="team-header">
                    <div class="team-header-top">
                        <div class="team-icon">${team.icon}</div>
                        <div class="team-info">
                            <div class="team-id">${team.id}</div>
                            <h1 class="team-name">${team.name}</h1>
                            <p class="team-mission">${team.mission}</p>
                        </div>
                    </div>
                    <div class="expectation-box">
                        <div class="expectation-label">💭 Founder's Expectation</div>
                        <p class="expectation-text">${team.expectation}</p>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">
                        <span class="section-icon">👥</span>
                        <h2 class="section-title">メンバー</h2>
                        <span class="section-count">${team.members.length}名</span>
                    </div>
                    <div class="section-body">
                        <div class="member-grid">
                            ${team.members.map(m => `
                                <a href="member-detail.html?id=${m.id}" class="member-card">
                                    <div class="member-avatar ${m.leader ? 'leader' : ''}">${m.avatar}</div>
                                    <div class="member-info">
                                        <div class="member-name">${m.name}</div>
                                        <div class="member-role">${m.role} / ${m.title}</div>
                                        <div class="member-focus">${m.focus}</div>
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">
                        <span class="section-icon">📂</span>
                        <h2 class="section-title">プロジェクト</h2>
                        <span class="section-count">${team.projects.length}件</span>
                    </div>
                    <div class="section-body">
                        <div class="project-list">
                            ${team.projects.map(p => `
                                <a href="project-detail.html?id=${p.id}" class="project-card">
                                    <span class="project-status ${p.status}"></span>
                                    <div class="project-info">
                                        <div class="project-name">${p.name}</div>
                                        <div class="project-desc">${p.desc}</div>
                                    </div>
                                    <span class="project-badge ${p.status}">${p.status === 'progress' ? '進行中' : '計画中'}</span>
                                    <span class="project-arrow">→</span>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                </div>

                ${team.media && team.media.length > 0 ? `
                <div class="section">
                    <div class="section-header">
                        <span class="section-icon">📺</span>
                        <h2 class="section-title">メディア戦略</h2>
                        <span class="section-count">${team.media.length}メディア</span>
                    </div>
                    <div class="section-body">
                        <div class="media-list">
                            ${team.media.map(m => `
                                <div class="media-card">
                                    <div class="media-header">
                                        <div class="media-name">${m.name}</div>
                                        <div class="media-leader">${m.leader}</div>
                                    </div>
                                    <div class="media-target"><strong>ターゲット:</strong> ${m.target}</div>
                                    <div class="media-desc">${m.desc}</div>
                                    <div class="media-strategy"><strong>戦略的意図:</strong> ${m.strategy}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
                ` : ''}

                ${team.relatedTeams.length > 0 ? `
                <div class="section">
                    <div class="section-header">
                        <span class="section-icon">🔗</span>
                        <h2 class="section-title">連携チーム</h2>
                    </div>
                    <div class="section-body">
                        <div class="related-teams">
                            ${team.relatedTeams.map(t => `
                                <a href="team-detail.html?id=${t.id}" class="related-team-badge">
                                    ${t.icon} ${t.name}
                                </a>
                            `).join('')}
                        </div>
                    </div>
                </div>
                ` : ''}
            `;
        }

        render();
    </script>
</body>
</html>
