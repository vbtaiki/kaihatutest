    <style>
        :root {
            --primary: #00BFA5;
            --primary-light: #E0F7F4;
            --primary-dark: #00A896;
            --bg: #FAFBFC;
            --white: #FFFFFF;
            --text: #1A1A1A;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #E8E8E8;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans JP', sans-serif;
            min-height: 100vh;
            line-height: 1.7;
        }

        a { color: inherit; text-decoration: none; }

        /* Header */
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }

        .logo { display: flex; align-items: center; gap: 0.5rem; }

        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .logo-text span { color: var(--primary); }

        .nav { display: flex; gap: 0.5rem; }

        .nav a {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .nav a:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav a.active {
            background: var(--primary);
            color: white;
        }

        /* Main */
        .main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 88px 2rem 2rem;
        }

        /* Back Link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: opacity 0.2s;
        }

        .back-link:hover { opacity: 0.7; }

        /* Member Header */
        .member-header {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
        }

        .member-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 600;
            background: var(--primary-light);
            color: var(--primary);
            flex-shrink: 0;
        }

        .member-avatar.founder {
            background: linear-gradient(135deg, var(--primary) 0%, #26D0B8 100%);
            color: white;
        }

        .member-avatar.executive {
            background: var(--primary);
            color: white;
        }

        .member-info { flex: 1; }

        .member-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .member-title {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .member-teams {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .team-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.75rem;
            background: var(--primary-light);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--primary-dark);
            transition: all 0.2s;
        }

        .team-badge:hover {
            background: var(--primary);
            color: white;
        }

        .team-badge.leader {
            background: var(--primary);
            color: white;
        }

        /* Section */
        .section {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .section-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-icon { font-size: 1.25rem; }

        .section-title { font-size: 1rem; font-weight: 600; }

        .section-body { padding: 1.5rem; }

        /* Focus List */
        .focus-list { list-style: none; }

        .focus-list li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
        }

        .focus-list li::before {
            content: '→';
            position: absolute;
            left: 0;
            color: var(--primary);
        }

        /* Project List */
        .project-list { list-style: none; }

        .project-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background: #F9F9F9;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: all 0.2s;
        }

        .project-item:hover {
            background: var(--primary-light);
        }

        .project-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .project-status.planning { background: #FF9800; }
        .project-status.progress { background: #2196F3; }

        .project-name { flex: 1; font-size: 0.9rem; }

        .project-badge {
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
        }

        .project-badge.planning {
            background: #FFF3E0;
            color: #FF9800;
        }

        .project-badge.progress {
            background: #E3F2FD;
            color: #2196F3;
        }

        /* Team Card */
        .team-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }

        .team-card:last-child { margin-bottom: 0; }

        .team-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }

        .team-card-header {
            padding: 1rem 1.25rem;
            display: flex;
            gap: 0.75rem;
            align-items: center;
            background: #F9F9F9;
            border-bottom: 1px solid var(--border);
        }

        .team-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            background: var(--primary-light);
        }

        .team-card-info { flex: 1; }

        .team-card-name {
            font-size: 1rem;
            font-weight: 600;
        }

        .team-card-role {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .team-card-arrow {
            color: var(--primary);
            font-size: 1.25rem;
        }

        .team-card-body { padding: 1rem 1.25rem; }

        .team-expectation {
            background: var(--primary-light);
            border-left: 3px solid var(--primary);
            padding: 0.75rem 1rem;
            border-radius: 0 8px 8px 0;
        }

        .team-expectation-label {
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .team-expectation p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
            background: var(--white);
        }

        .footer a { color: var(--primary); }

        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .header-content { flex-direction: column; gap: 0.75rem; height: auto; padding: 0.75rem 0; }
            .main { padding-top: 120px; }
            .member-header { flex-direction: column; text-align: center; }
            .member-teams { justify-content: center; }
        }
    </style>
</head>

                        `).join('')}
                    </div>
                </div>
                ` : ''}

                <div class="section">
                    <div class="section-header">
                        <span class="section-icon">🏢</span>
                        <h2 class="section-title">所属チーム</h2>
                    </div>
                    <div class="section-body">
                        ${member.teams.map(t => `
                            <a href="teams.html#${t.id}" class="team-card">
                                <div class="team-card-header">
                                    <div class="team-card-icon">${t.icon}</div>
                                    <div class="team-card-info">
                                        <div class="team-card-name">${t.name}</div>
                                        <div class="team-card-role">${t.role}</div>
                                    </div>
                                    <span class="team-card-arrow">→</span>
                                </div>
                                <div class="team-card-body">
                                    <div class="team-expectation">
                                        <div class="team-expectation-label">💭 Founder's Expectation</div>
                                        <p>${teamExpectations[t.id] || ''}</p>
                                    </div>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
